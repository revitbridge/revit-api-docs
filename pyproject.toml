[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "revit-api-docs"
version = "0.1.0"
description = "Revit API reference search for MCP hosts: local semantic + keyword lookup over the Revit 2026 API docs and SDK samples"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "revitbridge" }]
keywords = ["revit", "bim", "mcp", "rag", "api-docs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
# This package may depend on a vector store and an embedding client;
# revit-bridge must never depend on this package (see CLAUDE.md).
dependencies = [
  "mcp>=2,<3",
  "chromadb>=1,<2",
  "openai>=1,<3",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Offline data pipeline (pipeline/ in the repository): CHM parsing, batch
# embedding, SDK sample extraction. Not needed to run the server.
pipeline = [
  "beautifulsoup4>=4.12",
  "tqdm>=4.66",
  "google-genai>=1",
  "tree-sitter>=0.20",
  "tree-sitter-c-sharp>=0.20",
]

[project.urls]
Homepage = "https://github.com/revitbridge/revit-api-docs"
Issues = "https://github.com/revitbridge/revit-api-docs/issues"
Changelog = "https://github.com/revitbridge/revit-api-docs/blob/main/CHANGELOG.md"
Data = "https://github.com/revitbridge/revit-api-docs/releases/tag/v1.0-data"

[project.scripts]
revit-api-docs = "revit_api_docs.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["revit_api_docs"]

[tool.hatch.build.targets.sdist]
include = [
  "revit_api_docs",
  "pipeline",
  "tests",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
