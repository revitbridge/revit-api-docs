# Second retrieval regression query set for the Revit 2026 API reference (data
# release v1.0-data: sqlite/revit_api.db, 27,596 rows), written separately
# from retrieval_queries.yaml with no query in common. English queries and
# public API names only; used by tests/test_bm25_recall.py, which needs no
# network.
#
# Groups (15 N, 15 T, 10 F, 20 X):
#   N  an API name, as a model asks once it knows roughly what it wants
#   T  a short task description in plain English
#   F  an outdated or removed API name, or a member put on the wrong class;
#      the gold is the current API that does the job
#   X  nothing in the data set answers it: Revit 2027-only types; members
#      that do not exist (a class name used as a member, a member of another
#      class, a property that is really a parameter); misspellings; questions
#      that are not about Revit or not about the API. For the non-existent
#      members and the misspellings a nearby real API exists and is the
#      useful answer, so a relevance threshold is not expected to reject them
#
# Fields:
#   id, group, query  as above
#   gold_members      the API members that answer the query (Type.Member, or
#                     "Type Class" for a class page)
#   gold              every revit_api row of those members: row id, full_id,
#                     name. A member can span several rows (the overload-group
#                     page plus one page per overload); any gold row in the top
#                     5 counts as a hit
#   absent            group X only: what must not exist in revit_api.db.
#                     names: prefix match on name or substring of full_id;
#                     name_terms: substring of name or full_id; terms: substring
#                     of name, full_id, summary, syntax, remark, members,
#                     parameters or info
#   verified          gold rows and absences were checked against revit_api.db
#   verify_note       what that check found
#   note              what the query is about (API facts only)
