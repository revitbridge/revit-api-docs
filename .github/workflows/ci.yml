name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      # tests/test_shipped_db.py runs keyword-mode ranking checks against the
      # two SQLite files of the data release (34 MB), fetched once and cached.
      REVIT_API_DOCS_DATA_DIR: ${{ github.workspace }}/.data-cache
      REVIT_API_DOCS_TEST_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Cache the shipped SQLite files
        uses: actions/cache@v4
        with:
          path: .data-cache/sqlite
          key: revit-api-docs-sqlite-v1.0-data
      - name: Sync
        run: uv sync
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
      - name: Must not depend on revit-bridge
        shell: bash
        run: |
          if uv tree | grep -i "revit-bridge"; then
            echo "revit-bridge must not be a dependency of revit-api-docs" && exit 1
          fi
      - name: No secrets in the tree
        shell: bash
        # Key prefixes (OpenRouter, Anthropic, Google, GitHub) assembled from
        # parts so this file never contains the literal patterns itself.
        run: |
          p1='sk-or-v1'; p2='sk-ant'; p3='AIza'; p4='ghp'
          if git grep -nE "${p1}-|${p2}-|${p3}[0-9A-Za-z_-]{20,}|${p4}_" -- .; then
            echo "credential-like string found" && exit 1
          fi
      - name: CLI smoke
        run: uv run revit-api-docs --version
